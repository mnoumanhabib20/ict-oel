<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hero Section with bg.jpeg background -->
    <header>
        <nav>
            <a href="index.html">Home</a> | <a href="form.html">Register</a>
        </nav>
        <div class="hero-container">
            <div class="hero-text">
                <h1>Student Registration Form</h1>
                <p>Please fill out the form below accurately to complete your registration.</p>
            </div>
        </div>
    </header>

    <!-- Registration Form -->
    <form action="thanks.html" method="get">
        
        <label for="fn">Full Name:</label><br>
        <input type="text" id="fn" name="fullname" placeholder="Your name" required><br><br>

        <label for="reg">Registration No:</label><br>
        <input type="text" id="reg" name="registration_no" placeholder="F26607120" required><br><br>

        <label for="em">Email:</label><br>
        <input type="email" id="em" name="email" placeholder="abc@example.com" required><br><br>

        <label for="ph">Phone:</label><br>
        <input type="tel" id="ph" name="phone" placeholder="03XXXXXXXXX"><br><br>

        <label for="ag">Age:</label><br>
        <input type="number" id="ag" name="age" min="16" max="40"><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female<br><br>

        <label for="dp">Department:</label>
        <select id="dp" name="department">
            <option>AI</option>
            <option>CS</option>
            <option>SE</option>
            <option>EE</option>
        </select><br><br>

        <label>Interests:</label><br>
        <input type="checkbox" name="interest" value="Web"> Web
        <input type="checkbox" name="interest" value="AI"> AI
        <input type="checkbox" name="interest" value="Games"> Games<br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
